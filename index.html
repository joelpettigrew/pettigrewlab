<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pettigrew Lab</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(-45deg, #0f172a, #1e293b, #020617, #111827);
      background-size: 400% 400%;
      animation: gradient 12s ease infinite;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 600px;
      padding: 20px;
    }

    h1 {
      font-size: 3.2rem;
      margin-bottom: 0.5rem;
      letter-spacing: -1px;
    }

    p {
      opacity: 0.75;
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    .tagline {
      font-size: 0.9rem;
      opacity: 0.5;
      margin-top: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      backdrop-filter: blur(6px);
    }

    .btn:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-2px);
    }

    .dot {
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Pettigrew Lab</h1>

    <p>
      Building things<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span><br>
      Learning fast. Shipping often.
    </p>

    <a href="#" class="btn">Coming Soon</a>

    <div class="tagline">
      A place for experiments, ideas, and things that might actually work.
    </div>
  </div>

  <script defer src="/_vercel/analytics/script.js"></script>
</body>
</html>
